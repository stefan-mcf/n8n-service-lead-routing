<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title description">
  <title id="title">n8n service enquiry routing</title>
  <desc id="description">Readable routing map of the inactive 20-node n8n service enquiry workflow, including intake, validation, duplicate controls, human review, integration holds, and the operator register.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#121617" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#121617" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b979a"/>
    </marker>
    <style>
      .title{font:800 44px Arial,sans-serif;letter-spacing:-2.2px;fill:#121617}
      .subtitle{font:16px Arial,sans-serif;fill:#596466}
      .group-label{font:700 12px Arial,sans-serif;letter-spacing:1.4px;fill:#fff}
      .group-copy{font:11px Arial,sans-serif;fill:#dfe7ea}
      .node{fill:#1d2325;stroke:#829095;stroke-width:1.2}
      .node-action{fill:#20272a;stroke:#4d6f82}
      .node-stop{fill:#2c2326;stroke:#b96a7b}
      .node-review{fill:#26243a;stroke:#8f80d8}
      .node-store{fill:#252a23;stroke:#79a55a}
      .type{font:700 8px Arial,sans-serif;letter-spacing:1px;fill:#90a5ae}
      .name{font:700 11px Arial,sans-serif;fill:#f4f6f6}
      .small{font:700 9px Arial,sans-serif;fill:#f4f6f6}
      .path{fill:none;stroke:#8b979a;stroke-width:1.7;marker-end:url(#arrow)}
      .path-soft{fill:none;stroke:#728085;stroke-width:1.4;stroke-dasharray:4 4;marker-end:url(#arrow)}
      .branch{font:700 8px Arial,sans-serif;letter-spacing:.7px;fill:#a9b5b8}
      .metric-label{font:700 9px Arial,sans-serif;letter-spacing:1.2px;fill:#596466}
      .metric-value{font:700 17px Arial,sans-serif;letter-spacing:-.5px;fill:#121617}
    </style>
  </defs>

  <rect width="1280" height="960" fill="#d8dcdd"/>
  <rect width="1280" height="960" fill="url(#grid)"/>
  <text class="title" x="48" y="79">N8N SERVICE ENQUIRY ROUTING</text>
  <text class="subtitle" x="48" y="114">A readable map of the inactive 20-node workflow, from customer intake to recorded outcome.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="214" width="1184" height="700" rx="26" fill="#f1f3f3" stroke="#121617" stroke-opacity="0.16"/>
  </g>
  <rect x="64" y="238" width="1152" height="596" rx="18" fill="#111516"/>

  <rect x="82" y="258" width="214" height="556" rx="14" fill="#24449b"/>
  <text class="group-label" x="100" y="286">CUSTOMER INTAKE</text>
  <text class="group-copy" x="100" y="307">Structured, consented request</text>
  <text class="group-copy" x="100" y="323">enters one controlled flow.</text>

  <rect x="314" y="258" width="458" height="556" rx="14" fill="#252a2c"/>
  <text class="group-label" x="332" y="286">VALIDATION + ROUTING</text>
  <text class="group-copy" x="332" y="307">Required fields, persistent duplicate checks,</text>
  <text class="group-copy" x="332" y="323">human review, and integration holds.</text>

  <rect x="790" y="258" width="408" height="556" rx="14" fill="#063c24"/>
  <text class="group-label" x="808" y="286">CONTROLLED OUTCOMES</text>
  <text class="group-copy" x="808" y="307">Every path is recorded. CRM, booking, email,</text>
  <text class="group-copy" x="808" y="323">and SMS actions remain unconnected previews.</text>

  <!-- customer intake -->
  <g>
    <rect class="node node-action" x="102" y="444" width="78" height="66" rx="10"/>
    <text class="type" x="115" y="463">FORM</text>
    <text class="small" x="115" y="482">Request a</text>
    <text class="small" x="115" y="495">service quote</text>
    <rect class="node node-action" x="198" y="444" width="78" height="66" rx="10"/>
    <text class="type" x="211" y="463">CODE</text>
    <text class="small" x="211" y="482">Normalise</text>
    <text class="small" x="211" y="495">intake</text>
    <path class="path" d="M180 477 H198"/>
  </g>

  <!-- validation nodes -->
  <g>
    <rect class="node" x="336" y="444" width="94" height="66" rx="10"/>
    <text class="type" x="349" y="463">IF</text>
    <text class="name" x="349" y="486">Valid enquiry?</text>

    <rect class="node node-stop" x="466" y="350" width="122" height="64" rx="10"/>
    <text class="type" x="479" y="369">STOP</text>
    <text class="small" x="479" y="388">Reject incomplete</text>
    <text class="small" x="479" y="401">enquiry</text>

    <rect class="node" x="466" y="444" width="122" height="66" rx="10"/>
    <text class="type" x="479" y="463">DATA TABLE</text>
    <text class="name" x="479" y="486">Existing enquiry?</text>

    <rect class="node" x="466" y="552" width="122" height="66" rx="10"/>
    <text class="type" x="479" y="571">DATA TABLE</text>
    <text class="name" x="479" y="594">New enquiry?</text>

    <rect class="node node-stop" x="626" y="390" width="124" height="64" rx="10"/>
    <text class="type" x="639" y="409">STOP</text>
    <text class="name" x="639" y="432">Stop duplicate</text>

    <rect class="node" x="626" y="520" width="124" height="66" rx="10"/>
    <text class="type" x="639" y="539">IF</text>
    <text class="name" x="639" y="562">Human review?</text>

    <rect class="node node-review" x="626" y="626" width="124" height="66" rx="10"/>
    <text class="type" x="639" y="645">IF</text>
    <text class="name" x="639" y="668">Integration hold?</text>

    <path class="path" d="M276 477 H336"/>
    <path class="path" d="M430 467 C448 467 448 382 466 382"/>
    <text class="branch" x="438" y="414">NO</text>
    <path class="path" d="M430 483 H466"/>
    <text class="branch" x="438" y="475">YES</text>
    <path class="path-soft" d="M430 494 C448 494 448 585 466 585"/>
    <path class="path" d="M588 477 C607 477 607 422 626 422"/>
    <text class="branch" x="599" y="449">YES</text>
    <path class="path" d="M588 585 C607 585 607 553 626 553"/>
    <path class="path" d="M688 586 V626"/>
    <text class="branch" x="696" y="612">NO</text>
  </g>

  <!-- review and outcome nodes -->
  <g>
    <rect class="node node-review" x="808" y="354" width="112" height="64" rx="10"/>
    <text class="type" x="821" y="373">WAIT</text>
    <text class="small" x="821" y="392">Queue human</text>
    <text class="small" x="821" y="405">review</text>

    <rect class="node node-review" x="942" y="354" width="112" height="64" rx="10"/>
    <text class="type" x="955" y="373">FORM</text>
    <text class="small" x="955" y="392">Review service</text>
    <text class="small" x="955" y="405">enquiry</text>

    <rect class="node node-review" x="1076" y="354" width="104" height="64" rx="10"/>
    <text class="type" x="1089" y="373">CODE</text>
    <text class="small" x="1089" y="392">Apply review</text>
    <text class="small" x="1089" y="405">decision</text>

    <rect class="node node-store" x="1076" y="442" width="104" height="64" rx="10"/>
    <text class="type" x="1089" y="461">TABLE</text>
    <text class="small" x="1089" y="480">Update review</text>
    <text class="small" x="1089" y="493">outcome</text>

    <rect class="node node-action" x="808" y="540" width="112" height="64" rx="10"/>
    <text class="type" x="821" y="559">CODE</text>
    <text class="small" x="821" y="578">Prepare controlled</text>
    <text class="small" x="821" y="591">handoff</text>

    <rect class="node node-stop" x="808" y="646" width="112" height="64" rx="10"/>
    <text class="type" x="821" y="665">HOLD</text>
    <text class="small" x="821" y="684">Integration</text>
    <text class="small" x="821" y="697">exception</text>

    <rect class="node node-store" x="942" y="540" width="112" height="64" rx="10"/>
    <text class="type" x="955" y="559">CODE</text>
    <text class="small" x="955" y="578">Prepare register</text>
    <text class="small" x="955" y="591">row</text>

    <rect class="node node-store" x="1076" y="540" width="104" height="64" rx="10"/>
    <text class="type" x="1089" y="559">TABLE</text>
    <text class="small" x="1089" y="578">Store enquiry</text>
    <text class="small" x="1089" y="591">outcome</text>

    <path class="path" d="M750 540 C778 540 778 386 808 386"/>
    <text class="branch" x="766" y="458">YES</text>
    <path class="path" d="M920 386 H942"/>
    <path class="path" d="M1054 386 H1076"/>
    <path class="path" d="M1128 418 V442"/>

    <path class="path" d="M750 659 C778 659 778 572 808 572"/>
    <text class="branch" x="766" y="612">NO</text>
    <path class="path" d="M750 674 H808"/>
    <text class="branch" x="766" y="666">YES</text>
    <path class="path" d="M920 572 H942"/>
    <path class="path" d="M1054 572 H1076"/>

    <path class="path-soft" d="M527 350 C527 338 972 338 972 540"/>
    <path class="path-soft" d="M688 390 C782 390 782 528 942 558"/>
    <path class="path-soft" d="M688 520 C782 520 782 572 942 572"/>
    <path class="path-soft" d="M864 646 C910 646 910 604 942 588"/>
  </g>

  <line x1="48" y1="834" x2="1232" y2="834" stroke="#121617" stroke-opacity="0.16"/>
  <g>
    <line x1="344" y1="834" x2="344" y2="914" stroke="#121617" stroke-opacity="0.16"/>
    <line x1="640" y1="834" x2="640" y2="914" stroke="#121617" stroke-opacity="0.16"/>
    <line x1="936" y1="834" x2="936" y2="914" stroke="#121617" stroke-opacity="0.16"/>
    <text class="metric-label" x="68" y="861">ENTRY</text>
    <text class="metric-value" x="68" y="887">Quote request</text>
    <text class="metric-label" x="364" y="861">DUPLICATE CONTROL</text>
    <text class="metric-value" x="364" y="887">Persistent register</text>
    <text class="metric-label" x="660" y="861">HUMAN GATE</text>
    <text class="metric-value" x="660" y="887">Wait for decision</text>
    <text class="metric-label" x="956" y="861">EXTERNAL ACTIONS</text>
    <text class="metric-value" x="956" y="887">Preview only</text>
  </g>
</svg>
